<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prince AI 🚀</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="avatar">
          <span class="avatar-emoji">🤖</span>
          <span class="status-dot"></span>
        </div>
        <div class="header-info">
          <span class="bot-name">Prince AI</span>
          <span class="status" id="status">
            <i class="fas fa-circle"></i> Online
          </span>
        </div>
      </div>
      <div class="header-right">
       <button class="icon-btn" onclick="showThemePicker()" id="themeBtn" title="Change Theme">
        <i class="fas fa-palette"></i>
          </button>
        <button class="icon-btn" onclick="clearChat()" title="Clear Chat">
          <i class="fas fa-trash"></i>
        </button>
        <button class="icon-btn" onclick="exportChat()" title="Export Chat">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
      <div class="welcome-message">
        <div class="welcome-icon">👋</div>
        <h2>Welcome to Prince AI</h2>
        <p>Your intelligent assistant powered by advanced AI</p>
        <p class="welcome-subtext">Ask me anything, and I'll help you out!</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickMessage('Tell me a joke')">
            <i class="fas fa-laugh"></i> Tell me a joke
          </button>
          <button class="quick-btn" onclick="quickMessage('Help me code')">
            <i class="fas fa-code"></i> Help me code
          </button>
          <button class="quick-btn" onclick="quickMessage('Explain AI')">
            <i class="fas fa-brain"></i> Explain AI
          </button>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <span>Prince is typing...</span>
    </div>

    <!-- Chat Input -->
    <div class="chat-input">
      <button class="icon-btn" onclick="toggleVoice()" id="voiceBtn" title="Voice Input">
        <i class="fas fa-microphone"></i>
      </button>
      
      <button class="icon-btn" onclick="toggleSpeaking()" id="speakerBtn" title="Voice OFF">
        <i class="fas fa-volume-mute"></i>
      </button>
      
      <input 
        type="text" 
        id="userInput" 
        placeholder="Type your message..." 
        autocomplete="off"
        onkeypress="if(event.key === 'Enter') sendMessage()"
      />
      <button onclick="sendMessage()" id="sendBtn" class="send-btn">
        <i class="fas fa-paper-plane" id="btnIcon"></i>
      </button>
    </div>
 </div>

  <!-- Theme Picker Modal -->
  <div class="theme-picker-overlay" id="themePicker" style="display: none;">
    <div class="theme-picker-modal">
      <div class="theme-picker-header">
        <h2>🎨 Choose Your Theme</h2>
        <button class="close-theme-picker" onclick="closeThemePicker()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="theme-grid">
        <div class="theme-card" data-theme="pink-light" onclick="changeTheme('pink-light')">
          <div class="theme-preview pink-light-preview"></div>
          <span>Pink Light</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="dark" onclick="changeTheme('dark')">
          <div class="theme-preview dark-preview"></div>
          <span>Dark Pink</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="ocean" onclick="changeTheme('ocean')">
          <div class="theme-preview ocean-preview"></div>
          <span>Ocean Blue</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="sunset" onclick="changeTheme('sunset')">
          <div class="theme-preview sunset-preview"></div>
          <span>Sunset Orange</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="forest" onclick="changeTheme('forest')">
          <div class="theme-preview forest-preview"></div>
          <span>Forest Green</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="purple" onclick="changeTheme('purple')">
          <div class="theme-preview purple-preview"></div>
          <span>Royal Purple</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="cyberpunk" onclick="changeTheme('cyberpunk')">
          <div class="theme-preview cyberpunk-preview"></div>
          <span>Cyberpunk</span>
          <i class="fas fa-check theme-check"></i>
        </div>
        
        <div class="theme-card" data-theme="mint" onclick="changeTheme('mint')">
          <div class="theme-preview mint-preview"></div>
          <span>Mint Fresh</span>
          <i class="fas fa-check theme-check"></i>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme Picker Functions
    function showThemePicker() {
      document.getElementById('themePicker').style.display = 'flex';
      updateActiveTheme();
      sounds.receive();
    }

    function closeThemePicker() {
      document.getElementById('themePicker').style.display = 'none';
      sounds.send();
    }

    function changeTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateActiveTheme();
      sounds.receive();
    }

    function updateActiveTheme() {
      const currentTheme = localStorage.getItem('theme') || 'pink-light';
      document.querySelectorAll('.theme-card').forEach(card => {
        card.classList.remove('active');
        if (card.getAttribute('data-theme') === currentTheme) {
          card.classList.add('active');
        }
      });
    }

    // Close theme picker when clicking outside
    document.addEventListener('click', (e) => {
      const themePicker = document.getElementById('themePicker');
      if (e.target === themePicker) {
        closeThemePicker();
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
