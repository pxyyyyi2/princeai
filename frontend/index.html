<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prince AI 🚀</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="avatar">
          <span class="avatar-emoji">🤖</span>
          <span class="status-dot"></span>
        </div>
        <div class="header-info">
          <span class="bot-name">Prince AI</span>
          <span class="status" id="status">
            <i class="fas fa-circle"></i> Online
          </span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle Theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" onclick="clearChat()" title="Clear Chat">
          <i class="fas fa-trash"></i>
        </button>
        <button class="icon-btn" onclick="exportChat()" title="Export Chat">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
      <div class="welcome-message">
        <div class="welcome-icon">👋</div>
        <h2>Welcome to Prince AI</h2>
        <p>Your intelligent assistant powered by advanced AI</p>
        <p class="welcome-subtext">Ask me anything, and I'll help you out!</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickMessage('Tell me a joke')">
            <i class="fas fa-laugh"></i> Tell me a joke
          </button>
          <button class="quick-btn" onclick="quickMessage('Help me code')">
            <i class="fas fa-code"></i> Help me code
          </button>
          <button class="quick-btn" onclick="quickMessage('Explain AI')">
            <i class="fas fa-brain"></i> Explain AI
          </button>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <span>Prince is typing...</span>
    </div>

    <!-- Chat Input -->
    <div class="chat-input">
      <button class="icon-btn" onclick="toggleVoice()" id="voiceBtn" title="Voice Input">
        <i class="fas fa-microphone"></i>
      </button>
      
      <button class="icon-btn" onclick="toggleSpeaking()" id="speakerBtn" title="Voice OFF">
        <i class="fas fa-volume-mute"></i>
      </button>
      
      <input 
        type="text" 
        id="userInput" 
        placeholder="Type your message..." 
        autocomplete="off"
        onkeypress="if(event.key === 'Enter') sendMessage()"
      />
      <button onclick="sendMessage()" id="sendBtn" class="send-btn">
        <i class="fas fa-paper-plane" id="btnIcon"></i>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
